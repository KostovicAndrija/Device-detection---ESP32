<main class="login-page">
  <form class="panel login-card" (ngSubmit)="submit()">
    <p class="eyebrow">ESP32 monitoring</p>
    <h1>Prijava profesora</h1>
    <label>Korisničko ime <input name="username" [(ngModel)]="username" required /></label>
    <label>Lozinka <input name="password" type="password" [(ngModel)]="password" required /></label>
    @if (error()) { <p class="error">{{ error() }}</p> }
    <button type="submit" [disabled]="loading()">{{ loading() ? 'Prijava…' : 'Prijavi se' }}</button>
    <small>Razvojni nalog: admin / admin</small>
  </form>
</main>
