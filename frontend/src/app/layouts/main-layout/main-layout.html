<header class="topbar">
  <div>
    <h1>Detekcija uređaja</h1>
    <small class="status" [class.online]="realtime.connectionStatus() === 'connected'">
      ● {{ connectionLabels[realtime.connectionStatus()] }}
    </small>
  </div>
  <nav>
    <a routerLink="/my-devices" routerLinkActive="active">Moji uređaji</a>
    <a routerLink="/dashboard" routerLinkActive="active">Pregled</a>
    <a routerLink="/floor-map" routerLinkActive="active">Mapa učionice</a>
    <a routerLink="/devices" routerLinkActive="active">Uređaji</a>
    <a routerLink="/alerts" routerLinkActive="active">Alarmi</a>
    <a routerLink="/whitelist" routerLinkActive="active">Dozvoljeni uređaji</a>
    <a routerLink="/reports" routerLinkActive="active">Izveštaji</a>
    <button class="link-button" (click)="auth.logout()">Odjava</button>
  </nav>
</header>

<main>
  <router-outlet></router-outlet>
</main>
