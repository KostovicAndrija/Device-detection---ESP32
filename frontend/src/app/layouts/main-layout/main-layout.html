<header class="topbar">
  <div>
    <h1>Device Detection</h1>
    <small class="status" [class.online]="realtime.connectionStatus() === 'connected'">
      ● {{ realtime.connectionStatus() }}
    </small>
  </div>
  <nav>
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/floor-map" routerLinkActive="active">Floor map</a>
    <a routerLink="/devices" routerLinkActive="active">Devices</a>
    <a routerLink="/alerts" routerLinkActive="active">Alerts</a>
    <a routerLink="/whitelist" routerLinkActive="active">Whitelist</a>
    <a routerLink="/reports" routerLinkActive="active">Reports</a>
    <button class="link-button" (click)="auth.logout()">Odjava</button>
  </nav>
</header>

<main>
  <router-outlet></router-outlet>
</main>
