name: AI Build Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/ai-build-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ai-build-backend.yml"
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore DeviceDetection.slnx

      - name: Build
        run: dotnet build DeviceDetection.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DeviceDetection.slnx --configuration Release --no-build

      - name: Publish API
        run: dotnet publish src/Api/Api.csproj --configuration Release --no-build --output artifacts/api

      - name: Upload API
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: backend/artifacts/api
