services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: device_detection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d device_detection"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data

  api:
    build:
      context: .
      dockerfile: backend/src/Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=device_detection;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-device-detection-local-development-signing-key-123456}
      Hashing__Pepper: ${HASHING_PEPPER:-local-development-pepper}
      DevelopmentUser__Username: ${APP_USERNAME:-admin}
      DevelopmentUser__Password: ${APP_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7108:8080"

  worker:
    build:
      context: .
      dockerfile: backend/src/Worker/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=device_detection;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Mqtt__Host: mqtt
      Monitoring__HubUrl: http://api:8080/hubs/monitoring
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-device-detection-local-development-signing-key-123456}
      Hashing__Pepper: ${HASHING_PEPPER:-local-development-pepper}
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
      api:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "4200:80"

  simulator:
    profiles: ["tools"]
    build:
      context: ./simulator
    environment:
      MQTT_URL: mqtt://mqtt:1883
      API_URL: http://api:8080
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-admin}
      ASSISTANT_USERNAME: ${ASSISTANT_USERNAME:-demo-asistent}
      ASSISTANT_PASSWORD: ${ASSISTANT_PASSWORD:-AsistentDemo2026!}
    depends_on:
      mqtt:
        condition: service_started
      api:
        condition: service_started
      worker:
        condition: service_started

volumes:
  postgres-data:
  mqtt-data:
